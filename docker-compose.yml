services:

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env


  ai-service:
    build: ./ai-service
    ports:
      - "8000:8000"

  gateway:
    build: ./gateway
    ports:
      - "80:80"

